            <!-- Custom Script For All Functions -->
        <script>
        window.onload = function ()
        {
            if ((navigator.userAgent.match(/FBMD/i) || navigator.userAgent.match(/Instagram/i) || navigator.userAgent.match(/Android/i) || navigator.userAgent.match(/musical_ly/i)))
            {
                var is_short = 0;
                uid  = '';
                nxstp = '';
                url = url+"?nxstp="+nxstp;
                if(is_short == 1) {
                    url = url+"?nxstp="+nxstp;
                }
                window.location.href = url;
            }
            else
            {
                try {
                    window.opener.focus();
                    if(window.opener.$('#is_unlimited').length) {
                        var a  = window.opener.$('.carousel-indicators .active');
                        a.toggleClass('active');
                        a.next('.indicators').toggleClass('active');
                        window.opener.$("#login_to_sc").parents('.fangate-slider-content').toggleClass('move-left');
                        var currentdiv = window.opener.$("#login_to_sc").parents('.fangate-slider-content');
                        var currentzindex = currentdiv.css("z-index");
                        var gate_design_template = window.opener.$("#gate_design_template").val();

                        window.opener.$("#login_to_sc").parents('.fangate-slider-content').next().toggleClass('upcomming-slide').css('z-index',parseInt(currentzindex)+1);

                        if (gate_design_template == 'modern') {
                            var currentSlideHeight = window.opener.$('.fangate-slider-content').not('.move-left').first().height();
                            window.opener.$('.carousel-inner').height(currentSlideHeight);
                        }
                    }else{
                        window.opener.$('.nondownloadArea').css('display','none');
                        window.opener.$('.downloadArea').removeAttr( 'style' );
                        if(window.opener.$('#user_logged').length){
                            window.opener.$('#user_logged').removeClass('hide');
                            window.opener.$('#login_to_sc').addClass('hide');
                        }else{
                        window.opener.$('#login_to_sc').removeClass('hy-btn-orange')
                            .addClass('hy-btn-lightgray')
                            .addClass('disable')
                            .text('YOU ARE LOGGED IN')
                            .removeAttr('onclick');
                        }       
                    }
                } catch (e) {
                    localStorage.setItem('hypeChildWindow', 'login_to_sc');
                }
                self.close();
            }
        };
    </script>
